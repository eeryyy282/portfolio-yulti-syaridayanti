<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FCD5E1"/>
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F47FA4"/>
      <stop offset="100%" stop-color="#EC4E80"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  {/* Background */}
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="170" fill="#FFFFFF" opacity="0.6"/>

  {/* Sparkles */}
  <circle cx="90" cy="90" r="8" fill="#FDA4AF" opacity="0.5"/>
  <circle cx="320" cy="80" r="12" fill="#99F6E4" opacity="0.6"/>
  <circle cx="340" cy="280" r="6" fill="#FDA4AF" opacity="0.7"/>

  {/* Shoulders / Healthcare Coat */}
  <path d="M100 370C100 300 135 270 200 270C265 270 300 300 300 370V400H100V370Z" fill="url(#coatGrad)" stroke="#FCD5E1" stroke-width="3"/>
  
  {/* Inner Pink Collar */}
  <path d="M175 270H225L215 325L200 340L185 325L175 270Z" fill="#F47FA4"/>
  
  {/* Coat Lapels */}
  <path d="M150 270L200 340L180 342L135 285" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M250 270L200 340L220 342L265 285" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  {/* Stethoscope */}
  <path d="M170 275C170 310 185 330 200 330C215 330 230 310 230 275" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 330V355" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="363" r="10" fill="#2DD4BF" stroke="#0D9488" stroke-width="3"/>

  {/* Neck */}
  <rect x="185" y="220" width="30" height="60" rx="12" fill="#FED7AA"/>

  {/* Hijab Base */}
  <path d="M140 180C140 100 170 70 200 70C230 70 260 100 260 180C260 240 245 275 200 275C155 275 140 240 140 180Z" fill="url(#hijabGrad)"/>

  {/* Face Oval */}
  <ellipse cx="200" cy="180" rx="38" ry="48" fill="#FED7AA"/>

  {/* Inner Hijab Fold */}
  <path d="M165 170C165 140 180 135 200 135C220 135 235 140 235 170C235 190 225 215 200 215C175 215 165 190 165 170Z" fill="#FDE047" opacity="0.15"/>

  {/* Eyebrows */}
  <path d="M178 162C183 159 189 160 193 162" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M207 162C211 160 217 159 222 162" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  {/* Eyes (Gentle, friendly smile) */}
  <ellipse cx="186" cy="172" rx="4.5" ry="3.5" fill="#1E293B"/>
  <ellipse cx="214" cy="172" rx="4.5" ry="3.5" fill="#1E293B"/>
  <circle cx="188" cy="170" r="1.5" fill="#FFFFFF"/>
  <circle cx="216" cy="170" r="1.5" fill="#FFFFFF"/>

  {/* Nose */}
  <path d="M200 177V187L197 189" stroke="#FDBA74" stroke-width="2" stroke-linecap="round"/>

  {/* Warm Sweet Smile */}
  <path d="M192 198C196 204 204 204 208 198" stroke="#EC4E80" stroke-width="3" stroke-linecap="round"/>

  {/* Rosy Cheeks */}
  <ellipse cx="178" cy="186" rx="6" ry="4" fill="#FDA4AF" opacity="0.6"/>
  <ellipse cx="222" cy="186" rx="6" ry="4" fill="#FDA4AF" opacity="0.6"/>
</svg>

